<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCT Personal AI Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #38bdf8;
      font-size: 36px;
    }

    .chatbox {
      background: #1e293b;
      border-radius: 20px;
      padding: 20px;
      height: 500px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .message {
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 75%;
      line-height: 1.4;
    }

    .bot {
      background: #334155;
      align-self: flex-start;
    }

    .user {
      background: #0284c7;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }

    .quick-buttons {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .quick-buttons button {
      background: #475569;
      color: white;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>CCT Personal AI Chatbot</h1>
      <p>Created by Clay Cangelosi Technologies</p>
    </div>

    <div class="chatbox">
      <div class="quick-buttons">
        <button onclick="quickAsk('What services do you offer?')">Services</button>
        <button onclick="quickAsk('How much does an AI app cost?')">Pricing</button>
        <button onclick="quickAsk('How can AI help my business?')">Business Help</button>
        <button onclick="quickAsk('How do I contact you?')">Contact</button>
      </div>

      <div class="messages" id="messages">
        <div class="message bot">
          Hello! I'm your personal AI chatbot. Ask me about AI apps, websites, marketing, or business growth.
        </div>
      </div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message here..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <div class="footer">
      Clay Cangelosi Technologies | 504-434-8614 | clay072078@gmail.com
    </div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();

      if (message === "") return;

      addMessage(message, "user");
      input.value = "";

      setTimeout(() => {
        const response = getBotResponse(message);
        addMessage(response, "bot");
      }, 600);
    }

    function quickAsk(text) {
      document.getElementById("userInput").value = text;
      sendMessage();
    }

    function addMessage(text, sender) {
      const messages = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "message " + sender;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function getBotResponse(input) {
      const text = input.toLowerCase();

      if (text.includes("service")) {
        return "We create AI apps, chatbots, websites, business automation tools, marketing graphics, and custom software for small businesses.";
      }

      if (text.includes("price") || text.includes("cost")) {
        return "Basic AI app projects can start at $500. More advanced apps with logins, dashboards, payments, or databases may cost more.";
      }

      if (text.includes("business")) {
        return "AI can help your business save time, answer customer questions, generate leads, schedule appointments, create ads, and automate daily tasks.";
      }

      if (text.includes("contact") || text.includes("phone") || text.includes("email")) {
        return "You can contact Clay Cangelosi Technologies at 504-434-8614 or email clay072078@gmail.com.";
      }

      if (text.includes("hello") || text.includes("hi")) {
        return "Hello! How can I help you today?";
      }

      return "That's a great question. This demo chatbot can be upgraded later to connect to real AI like OpenAI, Gemini, or a free local AI model.";
    }

    document.getElementById("userInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
